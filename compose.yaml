services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.18
    command:
      - /usr/local/bin/etcd
      - --name
      - etcd0
      - --listen-client-urls
      - http://0.0.0.0:2379
      - --advertise-client-urls
      - http://etcd:2379
      - --listen-peer-urls
      - http://0.0.0.0:2380
      - --initial-advertise-peer-urls
      - http://etcd:2380
      - --initial-cluster
      - etcd0=http://etcd:2380
      - --initial-cluster-state
      - new
    ports:
      - "2379:2379"
      - "2380:2380"

  barrier:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - etcd
    environment:
      ETCD_ENDPOINT: http://etcd:2379
      PARTIES: "3"
      BARRIER_KEY: barrier
    restart: on-failure